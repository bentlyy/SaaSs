<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solicitudes</title>
<!--
  Esta página no pide usuario ni contraseña: la sesión vive en el Core y este
  documento solo se sirve si ya la hay. Todo lo que se ve sale de la API, que
  filtra por organización; por eso acá no hay ningún dato de ninguna empresa.

  La forma (tarjetas, botones, tablas, canal lateral) viene de /amigo.css, que
  es la misma hoja en los nueve productos. Este archivo solo declara qué
  secciones tiene y con qué color las pinta: /style.css.
-->
<link rel="stylesheet" href="/style.css">
</head>
<body>

<div class="ui">

  <!-- ── el canal: igual en los nueve productos ─────────────────────── -->
  <aside class="ui-canal">
    <a class="ui-marca" href="/">
      <span class="ui-logo" data-amigo="logo" aria-hidden="true">SO</span>
      <span class="ui-marca__texto">
        <span class="ui-marca__nombre">Solicitudes</span>
        <span class="ui-marca__empresa" data-amigo="empresa"></span>
      </span>
    </a>

    <nav class="ui-nav" id="tabs" aria-label="Secciones de Solicitudes">
      <p class="ui-nav__titulo">Mesa de trabajo</p>
      <a href="?panel=solicitudes" data-tab="solicitudes">Solicitudes</a>
      <p class="ui-nav__titulo">Configuración</p>
      <a href="?panel=ajustes" data-tab="ajustes">Ajustes</a>

      <p class="ui-nav__titulo" data-amigo="otras-titulo" hidden>Mis otras herramientas</p>
      <div data-amigo="otras"></div>
    </nav>

    <div class="ui-pie">
      <span class="ui-avatar" data-amigo="avatar" aria-hidden="true">–</span>
      <span class="ui-pie__texto">
        <span class="ui-pie__nombre" data-amigo="usuario"></span>
        <span class="ui-pie__correo" data-amigo="correo"></span>
      </span>
      <a href="/auth/logout" title="Cerrar sesión">Salir</a>
    </div>
  </aside>

  <!-- ── barra ──────────────────────────────────────────────────────── -->
  <header class="ui-topbar">
    <div class="ui-topbar__titulo">
      <h1 data-amigo="titulo">Solicitudes</h1>
    </div>
    <div class="ui-topbar__acciones">
      <button type="button" class="ui-btn" id="solicitud-nueva">Nueva solicitud</button>
    </div>
  </header>

  <!-- ── contenido ──────────────────────────────────────────────────── -->
  <main class="ui-main">
    <div class="ui-envoltura">

      <!-- SOLICITUDES -->
      <section class="ui-panel" data-panel="solicitudes">
        <div class="ui-rejilla ui-rejilla--4" id="resumen"></div>

        <div class="ui-tarjeta" style="margin-top:1rem">
          <div class="ui-form__fila ui-form__fila--3">
            <div class="ui-campo">
              <label for="filtro-q">Buscar</label>
              <input id="filtro-q" placeholder="Título, solicitante, responsable…">
            </div>
            <div class="ui-campo">
              <label for="filtro-estado">Estado</label>
              <select id="filtro-estado">
                <option value="">Todos</option>
                <option value="open">Abierta</option>
                <option value="in_progress">En curso</option>
                <option value="resolved">Resuelta</option>
                <option value="closed">Cerrada</option>
                <option value="cancelled">Cancelada</option>
              </select>
            </div>
            <div class="ui-campo">
              <label for="filtro-prioridad">Prioridad</label>
              <select id="filtro-prioridad">
                <option value="">Todas</option>
                <option value="low">Baja</option>
                <option value="medium">Media</option>
                <option value="high">Alta</option>
                <option value="urgent">Urgente</option>
              </select>
            </div>
          </div>
        </div>

        <div class="ui-tarjeta" style="margin-top:1rem">
          <div id="solicitudes-lista"></div>
        </div>
      </section>

      <!-- AJUSTES -->
      <section class="ui-panel" data-panel="ajustes" hidden>
        <form class="ui-tarjeta ui-form" id="config-form" style="max-width:44rem">
          <div class="ui-tarjeta__cab">
            <h2>Ajustes</h2>
          </div>
          <div class="ui-form__fila ui-form__fila--2">
            <div class="ui-campo">
              <label for="cfg-moneda">Moneda</label>
              <input id="cfg-moneda" name="currency" maxlength="5">
            </div>
            <div class="ui-campo">
              <label for="cfg-zona">Zona horaria</label>
              <input id="cfg-zona" name="timezone" maxlength="60">
            </div>
          </div>
          <div class="ui-form__pie">
            <button type="submit" class="ui-btn">Guardar ajustes</button>
          </div>
        </form>
      </section>

    </div>
  </main>
</div>

<dialog id="solicitud-dialog" class="ui-ancho">
  <form class="ui-tarjeta ui-form" id="solicitud-form">
    <div class="ui-cabecera-modal">
      <h2 id="solicitud-form-titulo">Nueva solicitud</h2>
      <button type="button" class="ui-cerrar" id="solicitud-cerrar" aria-label="Cerrar">&times;</button>
    </div>

    <div class="ui-form__fila ui-form__fila--3">
      <div class="ui-campo">
        <label for="sol-folio">Folio</label>
        <input id="sol-folio" type="number" min="1" step="1">
        <span class="ui-pista">Lo propone el servidor</span>
      </div>
      <div class="ui-campo">
        <label for="sol-prioridad">Prioridad</label>
        <select id="sol-prioridad">
          <option value="low">Baja</option>
          <option value="medium" selected>Media</option>
          <option value="high">Alta</option>
          <option value="urgent">Urgente</option>
        </select>
      </div>
      <div class="ui-campo">
        <label for="sol-estado">Estado</label>
        <select id="sol-estado">
          <option value="open">Abierta</option>
          <option value="in_progress">En curso</option>
          <option value="resolved">Resuelta</option>
          <option value="closed">Cerrada</option>
          <option value="cancelled">Cancelada</option>
        </select>
      </div>
    </div>

    <div class="ui-campo">
      <label for="sol-titulo">Título</label>
      <input id="sol-titulo" required maxlength="200">
    </div>
    <div class="ui-campo">
      <label for="sol-descripcion">Descripción</label>
      <textarea id="sol-descripcion" maxlength="4000" rows="3"></textarea>
    </div>

    <div class="ui-form__fila ui-form__fila--2">
      <div class="ui-campo">
        <label for="sol-solicitante">Solicitante</label>
        <input id="sol-solicitante" required maxlength="150">
      </div>
      <div class="ui-campo">
        <label for="sol-correo">Correo del solicitante</label>
        <input id="sol-correo" type="email" maxlength="200">
      </div>
    </div>
    <div class="ui-form__fila ui-form__fila--2">
      <div class="ui-campo">
        <label for="sol-responsable">Responsable</label>
        <input id="sol-responsable" maxlength="150">
      </div>
      <div class="ui-campo">
        <label for="sol-vencimiento">Fecha límite</label>
        <input id="sol-vencimiento" type="date">
      </div>
    </div>
    <div class="ui-campo">
      <label for="sol-resolucion">Resolución</label>
      <textarea id="sol-resolucion" maxlength="4000" rows="2"></textarea>
    </div>

    <div id="hilo-seccion" hidden>
      <h4 style="margin-top:1.25rem">Comentarios</h4>
      <div id="hilo" class="ui-lista"></div>
      <div class="ui-fila" style="margin-top:.5rem">
        <div class="ui-campo ui-crece">
          <input id="comentario-texto" maxlength="4000" placeholder="Escribí un comentario…" aria-label="Comentario">
        </div>
        <button type="button" class="ui-btn ui-btn--chico" id="comentario-agregar">Agregar</button>
      </div>

      <h4 style="margin-top:1.25rem">Adjuntos</h4>
      <div id="adjuntos" class="ui-lista"></div>
      <div class="ui-fila" style="margin-top:.5rem">
        <div class="ui-campo ui-crece">
          <input id="adjunto-archivo" type="file" aria-label="Archivo para adjuntar">
        </div>
        <button type="button" class="ui-btn ui-btn--chico" id="adjunto-agregar">Adjuntar</button>
      </div>

      <h4 style="margin-top:1.25rem">Historial</h4>
      <div id="historial" class="ui-lista"></div>
    </div>

    <div class="ui-form__pie" style="margin-top:1.25rem">
      <button type="submit" class="ui-btn" id="solicitud-guardar">Guardar solicitud</button>
      <button type="button" class="ui-btn ui-btn--fantasma" id="solicitud-cancelar">Cancelar</button>
    </div>
  </form>
</dialog>

<div id="aviso" class="ui-aviso" hidden></div>
<script src="/amigo-ui.js"></script>
<script src="/amigo.js"></script>
<script src="/app.js"></script>
</body>
</html>
