<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clientes</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<!--
  Esta página no pide usuario ni contraseña: la sesión vive en el Core y este
  documento solo se sirve si ya la hay. Todo lo que se ve sale de la API, que
  filtra por organización; por eso acá no hay ningún dato de ninguna empresa.
-->
<header>
  <h1>Clientes</h1>
  <nav id="tabs">
    <button data-tab="tablero" class="activo">Tablero</button>
    <button data-tab="clientes">Clientes</button>
    <button data-tab="seguimientos">Seguimientos</button>
    <button data-tab="contactos">Contactos</button>
    <button data-tab="ajustes">Ajustes</button>
  </nav>
  <a id="salir" href="/auth/logout">Salir</a>
</header>

<main>
  <section id="panel-tablero">
    <div class="tarjetas" id="resumen"></div>
    <div class="tablero">
      <div class="columna">
        <h4>Vencidos</h4>
        <div id="seguimiento-vencidos" class="lineas"></div>
      </div>
      <div class="columna">
        <h4>Para hoy</h4>
        <div id="seguimiento-hoy" class="lineas"></div>
      </div>
      <div class="columna">
        <h4>Próximos</h4>
        <div id="seguimiento-proximos" class="lineas"></div>
      </div>
    </div>
    <div class="fila">
      <div>
        <label for="tablero-cliente">Cliente</label>
        <select id="tablero-cliente"></select>
      </div>
    </div>
    <h3>Cumpleaños del mes</h3>
    <div id="cumpleanos" class="lineas"></div>
    <h3>Últimos contactos</h3>
    <div id="contactos-recientes" class="lineas"></div>
  </section>

  <section id="panel-clientes" hidden>
    <form id="cliente-form">
      <h3><span id="cliente-form-titulo">Nuevo cliente</span></h3>
      <label for="cliente-nombre">Nombre</label>
      <input id="cliente-nombre" required maxlength="150">
      <label for="cliente-tipo">Tipo de ficha</label>
      <select id="cliente-tipo">
        <option value="persona">Persona</option>
        <option value="empresa">Empresa</option>
      </select>
      <label for="cliente-empresa">Razón social</label>
      <input id="cliente-empresa" maxlength="200">
      <label for="cliente-telefono">Teléfono</label>
      <input id="cliente-telefono" maxlength="40">
      <label for="cliente-correo">Correo</label>
      <input id="cliente-correo" type="email" maxlength="200">
      <label for="cliente-documento">RUT / RUC / NIT</label>
      <input id="cliente-documento" maxlength="32">
      <label for="cliente-cumpleanos">Cumpleaños</label>
      <input id="cliente-cumpleanos" type="date">
      <label for="cliente-direccion">Dirección</label>
      <input id="cliente-direccion" maxlength="300">
      <label for="cliente-ciudad">Ciudad</label>
      <input id="cliente-ciudad" maxlength="120">
      <label for="cliente-notas">Notas</label>
      <input id="cliente-notas" maxlength="2000">
      <label for="cliente-etiquetas">Etiquetas (separadas por comas)</label>
      <input id="cliente-etiquetas" maxlength="500">
      <input type="hidden" id="cliente-id">
      <div class="fila">
        <button type="submit">Guardar</button>
        <button type="button" id="cliente-cancelar" hidden>Cancelar</button>
      </div>
    </form>
    <div class="fila">
      <label for="cliente-buscar">Buscar</label>
      <input id="cliente-buscar" maxlength="100" placeholder="Nombre, teléfono, documento…">
    </div>
    <div id="clientes-lista"></div>
  </section>

  <section id="panel-seguimientos" hidden>
    <form id="seguimiento-form">
      <h3><span id="seguimiento-form-titulo">Nuevo seguimiento</span></h3>
      <label for="seguimiento-cliente">Cliente</label>
      <select id="seguimiento-cliente" required></select>
      <label for="seguimiento-titulo">Qué hay que hacer</label>
      <input id="seguimiento-titulo" required maxlength="150">
      <label for="seguimiento-detalle">Detalle</label>
      <input id="seguimiento-detalle" maxlength="2000">
      <label for="seguimiento-fecha">Para el día</label>
      <input id="seguimiento-fecha" type="date">
      <label for="seguimiento-estado">Estado</label>
      <select id="seguimiento-estado">
        <option value="pending">Pendiente</option>
        <option value="done">Hecho</option>
        <option value="canceled">Cancelado</option>
      </select>
      <input type="hidden" id="seguimiento-id">
      <div class="fila">
        <button type="submit">Guardar</button>
        <button type="button" id="seguimiento-cancelar" hidden>Cancelar</button>
      </div>
    </form>
    <div id="seguimientos-lista"></div>
  </section>

  <section id="panel-contactos" hidden>
    <!--
      El historial de contacto no tiene un form de edición, y no es una falta de
      pantalla: una fila de contacto es la prueba de lo que pasó, y se corrige
      agregando otra fila, no editando la vieja.
    -->
    <form id="contacto-form">
      <h3>Registrar un contacto</h3>
      <label for="contacto-cliente">Cliente</label>
      <select id="contacto-cliente" required></select>
      <label for="contacto-tipo">Tipo</label>
      <select id="contacto-tipo">
        <option value="llamada">Llamada</option>
        <option value="correo">Correo</option>
        <option value="visita">Visita</option>
        <option value="nota">Nota</option>
      </select>
      <label for="contacto-resumen">Qué pasó</label>
      <input id="contacto-resumen" required maxlength="150">
      <button type="submit">Registrar</button>
    </form>
    <div id="contactos-lista"></div>
  </section>

  <section id="panel-ajustes" hidden>
    <form id="config-form">
      <h3>Ajustes</h3>
      <label for="cfg-moneda">Moneda</label>
      <input id="cfg-moneda" name="currency" maxlength="5">
      <label for="cfg-zona">Zona horaria</label>
      <input id="cfg-zona" name="timezone" maxlength="64">
      <button type="submit">Guardar ajustes</button>
    </form>
  </section>
</main>

<dialog id="ficha-dialog">
  <div id="ficha"></div>
  <div class="fila">
    <button type="button" id="ficha-cerrar">Cerrar</button>
  </div>
</dialog>

<div id="aviso" hidden></div>
<script src="/app.js"></script>
</body>
</html>
