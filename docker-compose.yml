# Suite SaaS Mini: la plataforma central (Core) + 8 productos sobre una misma
# imagen (core + build). Cada producto corre un workspace y persiste su SQLite en
# SU PROPIO volumen (saasmini_data_<producto>): aislamiento — un contenedor
# comprometido no puede leer ni escribir las bases de otro cliente (sin volumen
# compartido). Los JWT vienen del archivo .env de compose (generado en el servidor,
# NO commiteado).
#
# El servicio `landing` es distinto de los demás: no es un mini-SaaS, es el Core
# (@amg/platform). No usa clientsGuard ni JWT propio: guarda usuarios,
# organizaciones, sesiones, suscripciones y pagos en core.sqlite, y sirve la web
# (landing, catálogo, acceso, mi cuenta, mis aplicaciones).

x-app: &app
  image: saas-mini:latest
  build: .
  restart: unless-stopped
  # Rotacion de logs: el driver json-file de Docker NO rota solo y se lleva el
  # disco sin avisar (le paso a clinic-db: 331 MB en 3 semanas). Tope de ~30 MB
  # por servicio, 3 archivos, y el ciclo es automatico. Los 9 servicios heredan
  # este bloque del ancla, asi que no hay que repetirlo.
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  volumes:
    # Puerta de acceso: edita ops/clients.json en el servidor para activar/pausar clientes.
    # Al ser en vivo (bind mount), el cambio aplica sin rebuild ni reinicio de servicios.
    - ./ops/clients.json:/app/clients.json:ro
  environment: &base-env
    NODE_ENV: production
    # QUien decide el acceso, y solo para los 8 legacy (los unicos que montan
    # clients.json): el Core con `subscriptions`, o esta lista de emergencia.
    # `allowlist` es el unico modo que un producto legacy puede cumplir, porque
    # todavia no consulta suscripciones. Cuando un producto migre al Core, se
    # saca el bind mount de clients.json y la lista deja de existir para el.
    CLIENTS_GATE: allowlist

services:
  # peluqueria y recordatorios ya no tienen servicio: sus datos se migraron a
  # citas (25 citas, 25 lineas, 5 avisos) y arrancar los dos seria dos puertas
  # para el mismo producto. Sus volumenes quedan declarados ABAJO, sin servicio,
  # porque son la fuente de la migracion: borrarlos seria tirar los datos que
  # todavia no estan respaldados fuera de Docker.

  deportes:
    <<: *app
    container_name: saasmini-deportes
    volumes:
      - saasmini_data_deportes:/app/data/deportes
      - ./ops/clients.json:/app/clients.json:ro
    ports:
      - "127.0.0.1:3101:3000"
    environment:
      <<: *base-env
      PRODUCT: deportes
      PORT: "3000"
      DB_PATH: /app/data/deportes/app.db
      JWT_SECRET: ${DEPO_JWT:?falta DEPO_JWT en .env}
      APP_NAME: Reservas de Canchas
      APP_URL: https://canchas.amgdeveloper.cl

  talleres:
    <<: *app
    container_name: saasmini-talleres
    volumes:
      - saasmini_data_talleres:/app/data/talleres
      - ./ops/clients.json:/app/clients.json:ro
    ports:
      - "127.0.0.1:3102:3000"
    environment:
      <<: *base-env
      PRODUCT: talleres
      PORT: "3000"
      DB_PATH: /app/data/talleres/app.db
      JWT_SECRET: ${TALLE_JWT:?falta TALLE_JWT en .env}
      APP_NAME: Órdenes de Trabajo
      APP_URL: https://ordenes.amgdeveloper.cl

  # Inventario: sobre el runtime de AMG. No usa clientsGuard ni JWT propio: la
  # identidad y las suscripciones salen del Core por SSO.
  #
  # OJO: PRODUCT no es el slug del producto, es el WORKSPACE que arranca el CMD
  # (`npm run start -w "$PRODUCT"`). El slug real lo declara src/app.ts.
  #
  # Este producto NO monta clients.json ni consulta clientsGuard: su puerta es
  # `subscriptions` en el Core, que se mira en cada request. Por eso el
  # CLIENTS_GATE heredado no aplica aqui.
  inventario:
    <<: *app
    container_name: saasmini-inventario
    volumes:
      - saasmini_data_inventario:/app/data
    ports:
      - "127.0.0.1:3103:3000"
    environment:
      <<: *base-env
      PRODUCT: '@amg/inventario'
      PORT: "3000"
      DB_PATH: /app/data/inventario.sqlite
      DB_SCHEMA_VERSION: "1"
      APP_NAME: Inventario
      APP_URL: https://inventario.amgdeveloper.cl
      CORE_URL: https://desarrollador.amgdeveloper.cl
      AMG_SSO_CLIENT_ID: inventario
      AMG_SSO_CLIENT_SECRET: ${AMG_SSO_INVENTARIO_SECRET:?falta AMG_SSO_INVENTARIO_SECRET en .env}
      # Corta el acceso al instante si le cancelan la suscripción, a costa de una
      # llamada al Core por request. En produccion conviene 1.
      AMG_SSO_INTROSPECT: ${AMG_SSO_INTROSPECT:-1}

  # Citas: mismo runtime que inventario. Absorbe peluqueria, crm y recordatorios,
  # que quedan como fuentes de solo lectura de la migracion.
  citas:
    <<: *app
    container_name: saasmini-citas
    volumes:
      - saasmini_data_citas:/app/data
    ports:
      - "127.0.0.1:3104:3000"
    environment:
      <<: *base-env
      PRODUCT: '@amg/citas'
      PORT: "3000"
      DB_PATH: /app/data/citas.sqlite
      DB_SCHEMA_VERSION: "1"
      APP_NAME: Citas
      APP_URL: https://citas.amgdeveloper.cl
      CORE_URL: https://desarrollador.amgdeveloper.cl
      AMG_SSO_CLIENT_ID: citas
      AMG_SSO_CLIENT_SECRET: ${AMG_SSO_CITAS_SECRET:?falta AMG_SSO_CITAS_SECRET en .env}
      AMG_SSO_INTROSPECT: ${AMG_SSO_INTROSPECT:-1}

  cotizaciones:
    <<: *app
    container_name: saasmini-cotizaciones
    volumes:
      - saasmini_data_cotizaciones:/app/data/cotizaciones
      - ./ops/clients.json:/app/clients.json:ro
    ports:
      - "127.0.0.1:3104:3000"
    environment:
      <<: *base-env
      PRODUCT: cotizaciones
      PORT: "3000"
      DB_PATH: /app/data/cotizaciones/app.db
      JWT_SECRET: ${COTI_JWT:?falta COTI_JWT en .env}
      APP_NAME: Cotizaciones y Presupuestos
      APP_URL: https://presupuestos.amgdeveloper.cl

  documentos:
    <<: *app
    container_name: saasmini-documentos
    volumes:
      - saasmini_data_documentos:/app/data/documentos
      - ./ops/clients.json:/app/clients.json:ro
    ports:
      - "127.0.0.1:3105:3000"
    environment:
      <<: *base-env
      PRODUCT: documentos
      PORT: "3000"
      DB_PATH: /app/data/documentos/app.db
      JWT_SECRET: ${DOCU_JWT:?falta DOCU_JWT en .env}
      APP_NAME: Documentos y Comprobantes
      APP_URL: https://docs.amgdeveloper.cl

  # recordatorios se retiro: los avisos son infraestructura de citas, no un
  # producto vendible. Volumen conservado, ver la nota de arriba.

  crm:
    <<: *app
    container_name: saasmini-crm
    volumes:
      - saasmini_data_crm:/app/data/crm
      - ./ops/clients.json:/app/clients.json:ro
    ports:
      - "127.0.0.1:3107:3000"
    environment:
      <<: *base-env
      PRODUCT: crm
      PORT: "3000"
      DB_PATH: /app/data/crm/app.db
      JWT_SECRET: ${CRM_JWT:?falta CRM_JWT en .env}
      APP_NAME: Gestión de Clientes
      APP_URL: https://clientes.amgdeveloper.cl

  # ── Plataforma central (Core) ─────────────────────────────────────────────
  # Sirve la API de identidad/suscripciones y la web. Sin clients.json: el Core
  # no lleva la lista de tenants, usa core.sqlite (ver docs/ARCHITECTURE.md).
  landing:
    <<: *app
    container_name: saasmini-landing
    volumes:
      - saasmini_data_core:/app/data/core
    ports:
      - "127.0.0.1:3108:3000"
    environment:
      <<: *base-env
      PRODUCT: landing
      PORT: "3000"
      CORE_PORT: "3000"
      CORE_DB_PATH: /app/data/core/core.sqlite
      # URL pública real: aparece en los enlaces de SSO y de recuperación de
      # contraseña. Con esto en localhost, los correos mandan al lugar errado.
      CORE_URL: https://desarrollador.amgdeveloper.cl
      # Dos secretos y ninguno con valor por defecto en produccion (fail-fast).
      # AMG_SSO_ROOT_SECRET es la raiz de la que sale el secreto de cada producto
      # (HKDF): cambiarlo invalida todos los clientes SSO a la vez.
      AMG_SESSION_SECRET: ${AMG_SESSION_SECRET:?falta AMG_SESSION_SECRET en .env}
      AMG_SSO_ROOT_SECRET: ${AMG_SSO_ROOT_SECRET:?falta AMG_SSO_ROOT_SECRET en .env}
      CORE_RETURN_URL_HOSTS: amgdeveloper.cl,localhost
      APP_NAME: AMG
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-no-reply@amgdeveloper.cl}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-hola@amgdeveloper.cl}

volumes:
  # Los de peluqueria y recordatorios NO los usa ningun servicio: son la fuente
  # de la migracion a citas. Se conservan sin tocar hasta que exista un backup
  # externo verificado. Borrarlos con `docker volume rm` tira datos reales.
  saasmini_data_peluqueria:
  saasmini_data_deportes:
  saasmini_data_talleres:
  saasmini_data_inventario:
  saasmini_data_citas:
  saasmini_data_cotizaciones:
  saasmini_data_documentos:
  saasmini_data_recordatorios:
  saasmini_data_crm:
  saasmini_data_core:
