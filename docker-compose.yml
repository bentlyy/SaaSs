# Suite SaaS Mini: 8 productos sobre una misma imagen (core + build).
# Cada servicio corre un workspace y persiste su SQLite en el volumen saasmini_data.
# Los JWT vienen del archivo .env de compose (generado en el servidor, NO commiteado).

x-app: &app
  image: saas-mini:latest
  build: .
  restart: unless-stopped
  volumes:
    - saasmini_data:/app/data
    # Puerta de acceso: edita ops/clients.json en el servidor para activar/pausar clientes.
    # Al ser en vivo (bind mount), el cambio aplica sin rebuild ni reinicio de servicios.
    - ./ops/clients.json:/app/clients.json:ro
  environment: &base-env
    NODE_ENV: production

services:
  peluqueria:
    <<: *app
    container_name: saasmini-peluqueria
    ports:
      - "127.0.0.1:3100:3000"
    environment:
      <<: *base-env
      PRODUCT: peluqueria
      PORT: "3000"
      DB_PATH: /app/data/peluqueria/app.db
      JWT_SECRET: ${PELU_JWT:?falta PELU_JWT en .env}
      APP_NAME: Agenda de Citas
      APP_URL: https://agenda.amgdeveloper.cl

  deportes:
