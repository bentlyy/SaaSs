# Suite SaaS Mini: la plataforma central (Core) + los NUEVE productos, todos
# sobre una misma imagen (core + build). Cada producto corre un workspace y
# persiste su SQLite en SU PROPIO volumen (saasmini_data_<producto>):
# aislamiento — un contenedor comprometido no puede leer ni escribir las bases de
# otro cliente (sin volumen compartido).
#
# El servicio `landing` es distinto de los demás: no es un mini-SaaS, es el Core
# (@amg/platform). No tiene login propio: guarda usuarios, organizaciones,
# sesiones, suscripciones y pagos en core.sqlite, y sirve la web (landing,
# catálogo, acceso, mi cuenta, mis aplicaciones).
#
# ──Puertos y dominios────────────────────────────────────────────────────────
# El puerto NO se elige por estetica: se elige para que coincida con el reverse
# proxy que YA esta en el servidor (/etc/nginx/conf.d/saas-mini.conf). Un deploy
# que cambia el puerto de un dominio obliga a cambiar nginx en el mismo instante,
# y si esas dos cosas se desalinean el dominio abre el producto equivocado sin
# ningun error visible: fue lo que paso mientras los subdominios viejos (canchas,
# presupuestos) seguian apuntando a puertos que ya respondia otro producto.
#
# Desde el renombrado, el subdominio ES el nombre del producto (el slug): un solo
# nombre para el DNS, el nginx, la base y el login, y una clase entera de
# desalineaciones desaparece.
#
#   puerto  dominio                            producto
#   3100    citas.amgdeveloper.cl              citas
#   3101    espacios.amgdeveloper.cl           espacios
#   3102    solicitudes.amgdeveloper.cl        solicitudes
#   3103    inventario.amgdeveloper.cl         inventario
#   3104    cotizaciones.amgdeveloper.cl       cotizaciones
#   3105    crm.amgdeveloper.cl                crm
#   3106    activos.amgdeveloper.cl            activos
#   3107    checklists.amgdeveloper.cl         checklists
#   3108    desarrollo.amgdeveloper.cl         Core
#   3109    pagos.amgdeveloper.cl              pagos

# El rango 3100-3109 queda COMPLETO a proposito: los productos que ocupaban 3105
# (docs) y 3106 (recordatorios) se retiraron y sus puertos se reasignaron a
# crm y activos para no dejar huecos. Es seguro porque los dominios viejos
# redirigen por NOMBRE (301 a cotizaciones/citas, ver ops/nginx.conf), nunca por
# puerto: reciclar el numero no cruza a nadie. 3110 y 3111 quedan libres hacia
# arriba para productos futuros.

# Tres dominios (activos, checklists, pagos) son NUEVOS: necesitan registro DNS y
# certificado antes de publicar. `ops/nginx.conf` los trae ya, pero sin DNS el
# certbot no puede emitirlos.

x-app: &app
  image: saas-mini:latest
  build: .
  restart: unless-stopped
  # Rotacion de logs: el driver json-file de Docker NO rota solo y se lleva el
  # disco sin avisar (le paso a clinic-db: 331 MB en 3 semanas). Tope de ~30 MB
  # por servicio, 3 archivos, y el ciclo es automatico. Los servicios heredan
  # este bloque del ancla, asi que no hay que repetirlo.
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  environment: &base-env
    NODE_ENV: production
    # Los productos importan `config.ts` del Core (para verificar el SSO), y en
    # produccion ese modulo exige los dos secretos al cargarse (fail-fast, sin
    # valor por defecto). Sin ellos el proceso muere al arrancar con "Falta la
    # variable de entorno ...". `landing` los re-declara abajo con los mismos
    # valores: son los mismos del .env, y el duplicado es inofensivo.
    AMG_SESSION_SECRET: ${AMG_SESSION_SECRET:?falta AMG_SESSION_SECRET en .env}
    AMG_SSO_ROOT_SECRET: ${AMG_SSO_ROOT_SECRET:?falta AMG_SSO_ROOT_SECRET en .env}

services:
  # peluqueria, recordatorios, deportes, talleres, crm y documentos ya NO tienen
  # servicio ni volumen: sus datos se migraron a los productos que los absorben
  # (citas, espacios, solicitudes, crm y cotizaciones). El portafolio nuevo
  # solo usa los nueve volumenes de abajo.

  # Espacios: reservas de salas/canchas con disponibilidad y bloques. Producto
  # sobre el runtime de AMG: la identidad sale del Core por SSO, sin auth propio.
  espacios:
    <<: *app
    container_name: saasmini-espacios
    volumes:
      - saasmini_data_espacios:/app/data
    ports:
      - "127.0.0.1:3101:3000"
    environment:
      <<: *base-env
      PRODUCT: '@amg/espacios'
      PORT: "3000"
      DB_PATH: /app/data/espacios.sqlite
      DB_SCHEMA_VERSION: "2"
      APP_NAME: Espacios
      APP_URL: https://espacios.amgdeveloper.cl
      CORE_URL: https://desarrollo.amgdeveloper.cl
      AMG_SSO_CLIENT_ID: espacios
      AMG_SSO_CLIENT_SECRET: ${AMG_SSO_ESPACIOS_SECRET:?falta AMG_SSO_ESPACIOS_SECRET en .env}
      AMG_SSO_INTROSPECT: ${AMG_SSO_INTROSPECT:-1}

  # Solicitudes y ordenes: mesa de ayuda al estilo helpdesk (peticiones, planes,
  # comentarios, archivos adjuntos e historial de estados). Sin auth propio: la
  # identidad y las suscripciones salen del Core por SSO.
  solicitudes:
    <<: *app
    container_name: saasmini-solicitudes
    volumes:
      - saasmini_data_solicitudes:/app/data
    ports:
      - "127.0.0.1:3102:3000"
    environment:
      <<: *base-env
      PRODUCT: '@amg/solicitudes'
      PORT: "3000"
      DB_PATH: /app/data/solicitudes.sqlite
      DB_SCHEMA_VERSION: "1"
      APP_NAME: Solicitudes y Ordenes
      APP_URL: https://solicitudes.amgdeveloper.cl
      CORE_URL: https://desarrollo.amgdeveloper.cl
      AMG_SSO_CLIENT_ID: solicitudes
      AMG_SSO_CLIENT_SECRET: ${AMG_SSO_SOLICITUDES_SECRET:?falta AMG_SSO_SOLICITUDES_SECRET en .env}
      AMG_SSO_INTROSPECT: ${AMG_SSO_INTROSPECT:-1}

  # Inventario: items, movimientos y preferencias por organizacion. Sin auth
  # propio: la identidad y las suscripciones salen del Core por SSO.
  #
  # OJO: PRODUCT no es el slug del producto, es el WORKSPACE que arranca el CMD
  # (`npm run start -w "$PRODUCT"`). El slug real lo declara src/app.ts.
  inventario:
    <<: *app
    container_name: saasmini-inventario
    volumes:
      - saasmini_data_inventario:/app/data
    ports:
      - "127.0.0.1:3103:3000"
    environment:
      <<: *base-env
      PRODUCT: '@amg/inventario'
      PORT: "3000"
      DB_PATH: /app/data/inventario.sqlite
      DB_SCHEMA_VERSION: "1"
      APP_NAME: Inventario
      APP_URL: https://inventario.amgdeveloper.cl
      CORE_URL: https://desarrollo.amgdeveloper.cl
      AMG_SSO_CLIENT_ID: inventario
      AMG_SSO_CLIENT_SECRET: ${AMG_SSO_INVENTARIO_SECRET:?falta AMG_SSO_INVENTARIO_SECRET en .env}
      # Corta el acceso al instante si le cancelan la suscripción, a costa de una
      # llamada al Core por request. En produccion conviene 1.
      AMG_SSO_INTROSPECT: ${AMG_SSO_INTROSPECT:-1}

  # Citas: agenda con clientes, servicios, profesionales y avisos.
  citas:
    <<: *app
    container_name: saasmini-citas
    volumes:
      - saasmini_data_citas:/app/data
    ports:
      - "127.0.0.1:3100:3000"
    environment:
      <<: *base-env
      PRODUCT: '@amg/citas'
      PORT: "3000"
      DB_PATH: /app/data/citas.sqlite
      DB_SCHEMA_VERSION: "2"
      APP_NAME: Citas
      APP_URL: https://citas.amgdeveloper.cl
      CORE_URL: https://desarrollo.amgdeveloper.cl
      AMG_SSO_CLIENT_ID: citas
      AMG_SSO_CLIENT_SECRET: ${AMG_SSO_CITAS_SECRET:?falta AMG_SSO_CITAS_SECRET en .env}
      AMG_SSO_INTROSPECT: ${AMG_SSO_INTROSPECT:-1}

  # Cotizaciones: presupuestos con lineas, folio por empresa y tablero de
  # totales sin mezclar dinero entre organizaciones.
  cotizaciones:
    <<: *app
    container_name: saasmini-cotizaciones
    volumes:
      - saasmini_data_cotizaciones:/app/data
    ports:
      - "127.0.0.1:3104:3000"
    environment:
      <<: *base-env
      PRODUCT: '@amg/cotizaciones'
      PORT: "3000"
      DB_PATH: /app/data/cotizaciones.sqlite
      DB_SCHEMA_VERSION: "1"
      APP_NAME: Cotizaciones
      APP_URL: https://cotizaciones.amgdeveloper.cl
      CORE_URL: https://desarrollo.amgdeveloper.cl
      AMG_SSO_CLIENT_ID: cotizaciones
      AMG_SSO_CLIENT_SECRET: ${AMG_SSO_COTIZACIONES_SECRET:?falta AMG_SSO_COTIZACIONES_SECRET en .env}
      AMG_SSO_INTROSPECT: ${AMG_SSO_INTROSPECT:-1}

  # CRM: la ficha del cliente y sus seguimientos. Se llamaba `clientes` hasta que
  # Cloudflare marco `clientes.amgdeveloper.cl` como phishing; el slug y el host
  # se renombraron a la vez, asi que el producto, el DNS, el nginx, la base y el
  # login vuelven a ser un solo nombre. `clientes` queda en RETIRED_SLUGS.
  crm:
    <<: *app
    container_name: saasmini-crm
    volumes:
      - saasmini_data_crm:/app/data
    ports:
      - "127.0.0.1:3105:3000"
    environment:
      <<: *base-env
      PRODUCT: '@amg/crm'
      PORT: "3000"
      DB_PATH: /app/data/crm.sqlite
      DB_SCHEMA_VERSION: "1"
      APP_NAME: Clientes
      APP_URL: https://crm.amgdeveloper.cl
      CORE_URL: https://desarrollo.amgdeveloper.cl
      AMG_SSO_CLIENT_ID: crm
      AMG_SSO_CLIENT_SECRET: ${AMG_SSO_CRM_SECRET:?falta AMG_SSO_CRM_SECRET en .env}
      AMG_SSO_INTROSPECT: ${AMG_SSO_INTROSPECT:-1}

  # Activos: nuevo producto, sin fuente legacy. Control de patrimonio con
  # historial de movimientos; NO es el inventario de repuestos, que es otro
  # producto y otra base.
  activos:
    <<: *app
    container_name: saasmini-activos
    volumes:
      - saasmini_data_activos:/app/data
    ports:
      - "127.0.0.1:3106:3000"
    environment:
      <<: *base-env
      PRODUCT: '@amg/activos'
      PORT: "3000"
      DB_PATH: /app/data/activos.sqlite
      DB_SCHEMA_VERSION: "1"
      APP_NAME: Activos
      APP_URL: https://activos.amgdeveloper.cl
      CORE_URL: https://desarrollo.amgdeveloper.cl
      AMG_SSO_CLIENT_ID: activos
      AMG_SSO_CLIENT_SECRET: ${AMG_SSO_ACTIVOS_SECRET:?falta AMG_SSO_ACTIVOS_SECRET en .env}
      AMG_SSO_INTROSPECT: ${AMG_SSO_INTROSPECT:-1}

  # Checklists: nuevo producto, sin fuente legacy. Plantillas reutilizables y su
  # ejecucion, con snapshot para que editar la plantilla no altere lo ya
  # firmado en campo.
  checklists:
    <<: *app
    container_name: saasmini-checklists
    volumes:
      - saasmini_data_checklists:/app/data
    ports:
      - "127.0.0.1:3107:3000"
    environment:
      <<: *base-env
      PRODUCT: '@amg/checklists'
      PORT: "3000"
      DB_PATH: /app/data/checklists.sqlite
      DB_SCHEMA_VERSION: "2"
      APP_NAME: Checklists e Inspecciones
      APP_URL: https://checklists.amgdeveloper.cl
      CORE_URL: https://desarrollo.amgdeveloper.cl
      AMG_SSO_CLIENT_ID: checklists
      AMG_SSO_CLIENT_SECRET: ${AMG_SSO_CHECKLISTS_SECRET:?falta AMG_SSO_CHECKLISTS_SECRET en .env}
      AMG_SSO_INTROSPECT: ${AMG_SSO_INTROSPECT:-1}

  # Pagos: nuevo producto, sin fuente legacy. Cobros A clientes de la empresa,
  # que es lo contrario de la suscripcion que la empresa le paga a AMG (esa
  # vive en el Core). Ver docs/DATA_ISOLATION.md.
  pagos:
    <<: *app
    container_name: saasmini-pagos
    volumes:
      - saasmini_data_pagos:/app/data
    ports:
      - "127.0.0.1:3109:3000"
    environment:
      <<: *base-env
      PRODUCT: '@amg/pagos'
      PORT: "3000"
      DB_PATH: /app/data/pagos.sqlite
      # v2 por `charge_refunds`: los dos 409 de la cartera (borrar y cancelar un
      # cargo con plata) dicen que hay que devolver la plata, y sin esa tabla no
      # habia forma. El runtime SALTA toda migracion por encima de este numero
      # (`runMigrations`), asi que dejarlo en 1 no era "no migrar": era tener una
      # migracion escrita que nunca corre, y la tabla existiendo solo porque el
      # DDL la crea en cada arranque.
      DB_SCHEMA_VERSION: "2"
      APP_NAME: Control de Pagos
      APP_URL: https://pagos.amgdeveloper.cl
      CORE_URL: https://desarrollo.amgdeveloper.cl
      AMG_SSO_CLIENT_ID: pagos
      AMG_SSO_CLIENT_SECRET: ${AMG_SSO_PAGOS_SECRET:?falta AMG_SSO_PAGOS_SECRET en .env}
      AMG_SSO_INTROSPECT: ${AMG_SSO_INTROSPECT:-1}

  # ── Plataforma central (Core) ─────────────────────────────────────────────
  # Sirve la API de identidad/suscripciones y la web. Usa core.sqlite (ver
  # docs/ARCHITECTURE.md).
  landing:
    <<: *app
    container_name: saasmini-landing
    volumes:
      - saasmini_data_core:/app/data/core
    ports:
      - "127.0.0.1:3108:3000"
    environment:
      <<: *base-env
      PRODUCT: landing
      PORT: "3000"
      CORE_PORT: "3000"
      CORE_DB_PATH: /app/data/core/core.sqlite
      # URL pública real: aparece en los enlaces de SSO y de recuperación de
      # contraseña. Con esto en localhost, los correos mandan al lugar errado.
      CORE_URL: https://desarrollo.amgdeveloper.cl
      # Dos secretos y ninguno con valor por defecto en produccion (fail-fast).
      # AMG_SSO_ROOT_SECRET es la raiz de la que sale el secreto de cada producto
      # (HKDF): cambiarlo invalida todos los clientes SSO a la vez.
      AMG_SESSION_SECRET: ${AMG_SESSION_SECRET:?falta AMG_SESSION_SECRET en .env}
      AMG_SSO_ROOT_SECRET: ${AMG_SSO_ROOT_SECRET:?falta AMG_SSO_ROOT_SECRET en .env}
      CORE_RETURN_URL_HOSTS: amgdeveloper.cl,localhost
      APP_NAME: AMG
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-no-reply@amgdeveloper.cl}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-hola@amgdeveloper.cl}

volumes:
  # ── Los nueve, uno por producto ──────────────────────────────────────────
  saasmini_data_espacios:
  saasmini_data_citas:
  saasmini_data_inventario:
  saasmini_data_solicitudes:
  saasmini_data_cotizaciones:
  saasmini_data_crm:
  saasmini_data_activos:
  saasmini_data_checklists:
  saasmini_data_pagos:
  saasmini_data_core:
