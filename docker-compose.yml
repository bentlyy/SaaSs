# Suite SaaS Mini: la plataforma central (Core) + los NUEVE productos, todos
# sobre una misma imagen (core + build). Cada producto corre un workspace y
# persiste su SQLite en SU PROPIO volumen (saasmini_data_<producto>):
# aislamiento — un contenedor comprometido no puede leer ni escribir las bases de
# otro cliente (sin volumen compartido).
#
# El servicio `landing` es distinto de los demás: no es un mini-SaaS, es el Core
# (@amg/platform). No usa clientsGuard ni JWT propio: guarda usuarios,
# organizaciones, sesiones, suscripciones y pagos en core.sqlite, y sirve la web
# (landing, catálogo, acceso, mi cuenta, mis aplicaciones).
#
# ──Puertos y dominios────────────────────────────────────────────────────────
# El puerto NO se elige por estetica: se elige para que coincida con el reverse
# proxy que YA esta en el servidor (/etc/nginx/conf.d/saas-mini.conf). Un deploy
# que cambia el puerto de un dominio obliga a cambiar nginx en el mismo instante,
# y si esas dos cosas se desalinean el dominio abre el producto equivocado sin
# ningun error visible: fue lo que paso con canchas->3101 (espacios) y
# presupuestos->3104 (citas) mientras los legacy seguian ahi.
#
#   puerto  dominio                            producto
#   3100    agenda.amgdeveloper.cl             citas        (era peluqueria)
#   3101    canchas.amgdeveloper.cl            espacios     (absorbe deportes)
#   3102    ordenes.amgdeveloper.cl            solicitudes  (absorbe talleres)
#   3103    stock.amgdeveloper.cl              inventario
#   3104    presupuestos.amgdeveloper.cl       cotizaciones (absorbe documentos)
#   3107    clientes.amgdeveloper.cl           clientes     (absorbe crm)
#   3108    desarrollo.amgdeveloper.cl         Core
#   3109    activos.amgdeveloper.cl            activos      (nuevo)
#   3110    checklists.amgdeveloper.cl         checklists   (nuevo)
#   3111    pagos.amgdeveloper.cl              pagos        (nuevo)
#
# Los puertos 3105 (documentos) y 3106 (recordatorios) quedan LIBRES a proposito:
# sus productos se retiraron. No se reciclan porque un dominio viejo que todavia
# se teclea (docs.*, recordatorios.*) debe seguir levando a la redireccion nueva,
# no a un producto que hoy este asignado a otro.
#
# Tres dominios (activos, checklists, pagos) son NUEVOS: necesitan registro DNS y
# certificado antes de publicar. `ops/nginx.conf` los trae ya, pero sin DNS el
# certbot no puede emitirlos.

x-app: &app
  image: saas-mini:latest
  build: .
  restart: unless-stopped
  # Rotacion de logs: el driver json-file de Docker NO rota solo y se lleva el
  # disco sin avisar (le paso a clinic-db: 331 MB en 3 semanas). Tope de ~30 MB
  # por servicio, 3 archivos, y el ciclo es automatico. Los servicios heredan
  # este bloque del ancla, asi que no hay que repetirlo.
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  environment: &base-env
    NODE_ENV: production

services:
  # peluqueria, recordatorios, deportes, talleres, crm y documentos ya NO tienen
  # servicio: sus datos se migraron a los productos que los absorben (citas,
  # espacios, solicitudes, clientes y cotizaciones). Arrancar cualquiera de los
  # seis seria otra puerta para el mismo producto. Sus volumenes quedan
  # declarados ABAJO, sin servicio, porque son la fuente de las migraciones:
  # borrarlos seria tirar los datos que todavia no estan respaldados fuera de
  # Docker.

  # Reemplaza al legacy `deportes`, que vivia en el puerto 3101 con su propio
  # JWT_SECRET y su clients.json. Sus datos ya estan migrados a ESPACIOS, que
  # usa la misma organizacion del Core y nada de auth propio.
  espacios:
    <<: *app
    container_name: saasmini-espacios
    volumes:
      - saasmini_data_espacios:/app/data
    ports:
      - "127.0.0.1:3101:3000"
    environment:
      <<: *base-env
      PRODUCT: '@amg/espacios'
      PORT: "3000"
      DB_PATH: /app/data/espacios.sqlite
      DB_SCHEMA_VERSION: "1"
      APP_NAME: Espacios
      APP_URL: https://canchas.amgdeveloper.cl
      CORE_URL: https://desarrollo.amgdeveloper.cl
      AMG_SSO_CLIENT_ID: espacios
      AMG_SSO_CLIENT_SECRET: ${AMG_SSO_ESPACIOS_SECRET:?falta AMG_SSO_ESPACIOS_SECRET en .env}
      AMG_SSO_INTROSPECT: ${AMG_SSO_INTROSPECT:-1}

  # Reemplaza al legacy `talleres`, que vivia en el puerto 3102 con su propio
  # JWT_SECRET y su clients.json. Sus datos ya estan migrados a SOLICITUDES, que
  # usa la misma organizacion del Core y nada de auth propio.
  #
  # Lo unico que se conserva del producto viejo es el VOLUMEN, declarado ABAJO y
  # sin servicio: es la fuente de la migracion, y borrarlo seria tirar los datos
  # que todavia no estan respaldados fuera de Docker. Los datos de vehiculo NO
  # estan en el destino: `solicitudes` es para cualquier rubro y no tiene el
  # concepto. Quedan solo en ese volumen.
  solicitudes:
    <<: *app
    container_name: saasmini-solicitudes
    volumes:
      - saasmini_data_solicitudes:/app/data
    ports:
      - "127.0.0.1:3102:3000"
    environment:
      <<: *base-env
      PRODUCT: '@amg/solicitudes'
      PORT: "3000"
      DB_PATH: /app/data/solicitudes.sqlite
      DB_SCHEMA_VERSION: "1"
      APP_NAME: Solicitudes y Ordenes
      APP_URL: https://ordenes.amgdeveloper.cl
      CORE_URL: https://desarrollo.amgdeveloper.cl
      AMG_SSO_CLIENT_ID: solicitudes
      AMG_SSO_CLIENT_SECRET: ${AMG_SSO_SOLICITUDES_SECRET:?falta AMG_SSO_SOLICITUDES_SECRET en .env}
      AMG_SSO_INTROSPECT: ${AMG_SSO_INTROSPECT:-1}

  # Inventario: sobre el runtime de AMG. No usa clientsGuard ni JWT propio: la
  # identidad y las suscripciones salen del Core por SSO.
  #
  # OJO: PRODUCT no es el slug del producto, es el WORKSPACE que arranca el CMD
  # (`npm run start -w "$PRODUCT"`). El slug real lo declara src/app.ts.
  #
  # Este producto NO monta clients.json ni consulta clientsGuard: su puerta es
  # `subscriptions` en el Core, que se mira en cada request. Por eso el
  # CLIENTS_GATE de los legacy ya no existe en ningun servicio.
  inventario:
    <<: *app
    container_name: saasmini-inventario
    volumes:
      - saasmini_data_inventario:/app/data
    ports:
      - "127.0.0.1:3103:3000"
    environment:
      <<: *base-env
      PRODUCT: '@amg/inventario'
      PORT: "3000"
      DB_PATH: /app/data/inventario.sqlite
      DB_SCHEMA_VERSION: "1"
      APP_NAME: Inventario
      APP_URL: https://stock.amgdeveloper.cl
      CORE_URL: https://desarrollo.amgdeveloper.cl
      AMG_SSO_CLIENT_ID: inventario
      AMG_SSO_CLIENT_SECRET: ${AMG_SSO_INVENTARIO_SECRET:?falta AMG_SSO_INVENTARIO_SECRET en .env}
      # Corta el acceso al instante si le cancelan la suscripción, a costa de una
      # llamada al Core por request. En produccion conviene 1.
      AMG_SSO_INTROSPECT: ${AMG_SSO_INTROSPECT:-1}

  # Citas: mismo runtime que inventario. Absorbe peluqueria, crm y recordatorios,
  # que quedan como fuentes de solo lectura de la migracion.
  citas:
    <<: *app
    container_name: saasmini-citas
    volumes:
      - saasmini_data_citas:/app/data
    ports:
      - "127.0.0.1:3100:3000"
    environment:
      <<: *base-env
      PRODUCT: '@amg/citas'
      PORT: "3000"
      DB_PATH: /app/data/citas.sqlite
      DB_SCHEMA_VERSION: "1"
      APP_NAME: Citas
      APP_URL: https://agenda.amgdeveloper.cl
      CORE_URL: https://desarrollo.amgdeveloper.cl
      AMG_SSO_CLIENT_ID: citas
      AMG_SSO_CLIENT_SECRET: ${AMG_SSO_CITAS_SECRET:?falta AMG_SSO_CITAS_SECRET en .env}
      AMG_SSO_INTROSPECT: ${AMG_SSO_INTROSPECT:-1}

  # Reemplaza al legacy `cotizaciones` (puerto 3104, su propio JWT_SECRET) y al
  # legacy `documentos`, que se le suma. Los dos eran el mismo producto con dos
  # puertas: por eso sus dominios se funden en presupuestos.* y la base destino
  # guarda el folio por empresa y no global.
  cotizaciones:
    <<: *app
    container_name: saasmini-cotizaciones
    volumes:
      - saasmini_data_cotizaciones:/app/data
    ports:
      - "127.0.0.1:3104:3000"
    environment:
      <<: *base-env
      PRODUCT: '@amg/cotizaciones'
      PORT: "3000"
      DB_PATH: /app/data/cotizaciones.sqlite
      DB_SCHEMA_VERSION: "1"
      APP_NAME: Cotizaciones
      APP_URL: https://presupuestos.amgdeveloper.cl
      CORE_URL: https://desarrollo.amgdeveloper.cl
      AMG_SSO_CLIENT_ID: cotizaciones
      AMG_SSO_CLIENT_SECRET: ${AMG_SSO_COTIZACIONES_SECRET:?falta AMG_SSO_COTIZACIONES_SECRET en .env}
      AMG_SSO_INTROSPECT: ${AMG_SSO_INTROSPECT:-1}

  # Reemplaza al legacy `crm`, que vivia en el puerto 3107 con su propio
  # JWT_SECRET y su clients.json. Las 10 citas que tenia NO se migran aqui:
  # las absorbe CITAS, que ya las leyo de esta misma base. Aca van los clientes
  # y sus seguimientos.
  clientes:
    <<: *app
    container_name: saasmini-clientes
    volumes:
      - saasmini_data_clientes:/app/data
    ports:
      - "127.0.0.1:3107:3000"
    environment:
      <<: *base-env
      PRODUCT: '@amg/clientes'
      PORT: "3000"
      DB_PATH: /app/data/clientes.sqlite
      DB_SCHEMA_VERSION: "1"
      APP_NAME: Clientes
      APP_URL: https://clientes.amgdeveloper.cl
      CORE_URL: https://desarrollo.amgdeveloper.cl
      AMG_SSO_CLIENT_ID: clientes
      AMG_SSO_CLIENT_SECRET: ${AMG_SSO_CLIENTES_SECRET:?falta AMG_SSO_CLIENTES_SECRET en .env}
      AMG_SSO_INTROSPECT: ${AMG_SSO_INTROSPECT:-1}

  # Activos: nuevo producto, sin fuente legacy. Control de patrimonio con
  # historial de movimientos; NO es el inventario de repuestos, que es otro
  # producto y otra base.
  activos:
    <<: *app
    container_name: saasmini-activos
    volumes:
      - saasmini_data_activos:/app/data
    ports:
      - "127.0.0.1:3109:3000"
    environment:
      <<: *base-env
      PRODUCT: '@amg/activos'
      PORT: "3000"
      DB_PATH: /app/data/activos.sqlite
      DB_SCHEMA_VERSION: "1"
      APP_NAME: Activos
      APP_URL: https://activos.amgdeveloper.cl
      CORE_URL: https://desarrollo.amgdeveloper.cl
      AMG_SSO_CLIENT_ID: activos
      AMG_SSO_CLIENT_SECRET: ${AMG_SSO_ACTIVOS_SECRET:?falta AMG_SSO_ACTIVOS_SECRET en .env}
      AMG_SSO_INTROSPECT: ${AMG_SSO_INTROSPECT:-1}

  # Checklists: nuevo producto, sin fuente legacy. Plantillas reutilizables y su
  # ejecucion, con snapshot para que editar la plantilla no altere lo ya
  # firmado en campo.
  checklists:
    <<: *app
    container_name: saasmini-checklists
    volumes:
      - saasmini_data_checklists:/app/data
    ports:
      - "127.0.0.1:3110:3000"
    environment:
      <<: *base-env
      PRODUCT: '@amg/checklists'
      PORT: "3000"
      DB_PATH: /app/data/checklists.sqlite
      DB_SCHEMA_VERSION: "1"
      APP_NAME: Checklists e Inspecciones
      APP_URL: https://checklists.amgdeveloper.cl
      CORE_URL: https://desarrollo.amgdeveloper.cl
      AMG_SSO_CLIENT_ID: checklists
      AMG_SSO_CLIENT_SECRET: ${AMG_SSO_CHECKLISTS_SECRET:?falta AMG_SSO_CHECKLISTS_SECRET en .env}
      AMG_SSO_INTROSPECT: ${AMG_SSO_INTROSPECT:-1}

  # Pagos: nuevo producto, sin fuente legacy. Cobros A clientes de la empresa,
  # que es lo contrario de la suscripcion que la empresa le paga a AMG (esa
  # vive en el Core). Ver docs/DATA_ISOLATION.md.
  pagos:
    <<: *app
    container_name: saasmini-pagos
    volumes:
      - saasmini_data_pagos:/app/data
    ports:
      - "127.0.0.1:3111:3000"
    environment:
      <<: *base-env
      PRODUCT: '@amg/pagos'
      PORT: "3000"
      DB_PATH: /app/data/pagos.sqlite
      DB_SCHEMA_VERSION: "1"
      APP_NAME: Control de Pagos
      APP_URL: https://pagos.amgdeveloper.cl
      CORE_URL: https://desarrollo.amgdeveloper.cl
      AMG_SSO_CLIENT_ID: pagos
      AMG_SSO_CLIENT_SECRET: ${AMG_SSO_PAGOS_SECRET:?falta AMG_SSO_PAGOS_SECRET en .env}
      AMG_SSO_INTROSPECT: ${AMG_SSO_INTROSPECT:-1}

  # ── Plataforma central (Core) ─────────────────────────────────────────────
  # Sirve la API de identidad/suscripciones y la web. Sin clients.json: el Core
  # no lleva la lista de tenants, usa core.sqlite (ver docs/ARCHITECTURE.md).
  landing:
    <<: *app
    container_name: saasmini-landing
    volumes:
      - saasmini_data_core:/app/data/core
    ports:
      - "127.0.0.1:3108:3000"
    environment:
      <<: *base-env
      PRODUCT: landing
      PORT: "3000"
      CORE_PORT: "3000"
      CORE_DB_PATH: /app/data/core/core.sqlite
      # URL pública real: aparece en los enlaces de SSO y de recuperación de
      # contraseña. Con esto en localhost, los correos mandan al lugar errado.
      CORE_URL: https://desarrollo.amgdeveloper.cl
      # Dos secretos y ninguno con valor por defecto en produccion (fail-fast).
      # AMG_SSO_ROOT_SECRET es la raiz de la que sale el secreto de cada producto
      # (HKDF): cambiarlo invalida todos los clientes SSO a la vez.
      AMG_SESSION_SECRET: ${AMG_SESSION_SECRET:?falta AMG_SESSION_SECRET en .env}
      AMG_SSO_ROOT_SECRET: ${AMG_SSO_ROOT_SECRET:?falta AMG_SSO_ROOT_SECRET en .env}
      CORE_RETURN_URL_HOSTS: amgdeveloper.cl,localhost
      APP_NAME: AMG
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-no-reply@amgdeveloper.cl}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-hola@amgdeveloper.cl}

volumes:
  # ── Los nueve, uno por producto ──────────────────────────────────────────
  saasmini_data_espacios:
  saasmini_data_citas:
  saasmini_data_inventario:
  saasmini_data_solicitudes:
  saasmini_data_cotizaciones:
  saasmini_data_clientes:
  saasmini_data_activos:
  saasmini_data_checklists:
  saasmini_data_pagos:
  saasmini_data_core:

  # ── Los legacy: SIN servicio, y a proposito ────────────────────────────────
  # peluqueria, recordatorios, deportes, talleres, documentos y crm ya no los
  # usa nadie. Se conservan porque son la FUENTE de las migraciones a citas,
  # espacios, solicitudes, cotizaciones y clientes, y `ops/backup.sh` final ya
  # no los respalda: borrarlos con `docker volume rm` tira datos reales que solo
  # estan aqui.
  #
  # OJO, sobre lo que realmente los protege: ESTE archivo no los protege mucho.
  # Ningun servicio los monta, y compose descarta del config renderizado los
  # volumenes declarados que nadie usa, asi que aqui son documentacion. Quien los
  # monta de verdad es `ops/migrate.compose.yml`, y ahi si van `external: true` y
  # con el nombre real completo. Ese es el punto donde un `down -v` o un
  # `docker volume rm` se cruzaria con los datos, y los dos archivos tienen que
  # coincidir.
  #
  # Lo que si evita este archivo: que alguien los borre creyendo que "compose ya
  # no los usa, estan de mas". No se borran hasta que exista un respaldo externo
  # verificado de cada uno, y ese respaldo no este en el MISMO servidor (un fallo
  # de disco se los lleva juntos).
  #
  # `inventario` y `cotizaciones` NO aparecen aqui porque su volumen ya se usa
  # como destino de la migracion: la app.db legacy y la <producto>.sqlite nueva
  # conviven en el mismo volumen.
  saasmini_data_peluqueria:
    external: true
  saasmini_data_deportes:
    external: true
  saasmini_data_talleres:
    external: true
  saasmini_data_documentos:
    external: true
  saasmini_data_recordatorios:
    external: true
  saasmini_data_crm:
    external: true
