# Diagnostico temporal del servidor OCI. NO es para quedarse: se corre a mano
# (Actions > Diagnose server > Run workflow) y se borra al terminar.
#
# Reporta que esta llenando el disco: df, docker system df, imagenes,
# contenedores y los directorios mas pesados del store de Docker y del repo.
name: Diagnose server

on:
  workflow_dispatch:

jobs:
  diag:
    name: Estado del servidor
    runs-on: ubuntu-latest
    steps:
      - name: Recoger estado
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          if [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$HOST" ] || [ -z "$USER" ]; then
            echo "::error::Faltan los secretos DEPLOY_*; no se puede inspeccionar el server."
            exit 1
          fi

          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # TODO el script remoto va en un solo arg ssh con comillas simples.
          # REGLA: adentro NO van comillas simples (rompen el parseo local del
          # runner) ni parentesis. Todo lo que sea un valor sin espacios va a
          # secas; lo que tiene espacios, con comillas dobles.
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=accept-new \
            -o ServerAliveInterval=30 \
            "$USER@$HOST" '
          set -u
          echo "===== df -h ====="; df -h
          echo; echo "===== docker system df ====="; docker system df
          echo; echo "===== imagenes ====="; docker images
          echo; echo "===== contenedores ====="; docker ps -a --format "table {{.Names}}\t{{.Image}}\t{{.Status}}"
          echo; echo "===== lo mas pesado de /var/lib/docker ====="
          if command -v du >/dev/null 2>&1; then
            sudo du -h --max-depth=2 /var/lib/docker 2>/dev/null | sort -rh | head -25 || true
          fi
          echo; echo "===== lo mas pesado del repo saas-mini ====="
          if command -v du >/dev/null 2>&1; then
            du -h --max-depth=2 "$HOME/projects/saas-mini" 2>/dev/null | sort -rh | head -15 || true
          fi
          echo; echo "===== volumenes docker ====="; docker volume ls
          echo; echo "===== AMG_SSO_INTROSPECT resuelto por docker compose ====="
          docker compose -f "$HOME/projects/saas-mini/docker-compose.yml" -p saas-mini config 2>/dev/null | grep -A2 AMG_SSO_INTROSPECT | head -20 || echo "compose config no resuelve INTROSPECT"
          echo; echo "===== AMG_SSO_INTROSPECT en .env del server ====="
          if [ -f "$HOME/projects/saas-mini/.env" ]; then
            grep -E "^AMG_SSO_INTROSPECT=" "$HOME/projects/saas-mini/.env" || echo "AMG_SSO_INTROSPECT no definido en .env"
            grep -E "^CORE_SSO_" "$HOME/projects/saas-mini/.env" || true
          else
            echo "no existe $HOME/projects/saas-mini/.env"
          fi
          echo; echo "===== AMG_SSO_INTROSPECT runtime por contenedor (printenv) ====="
          for c in saasmini-landing saasmini-pagos saasmini-crm saasmini-inventario; do
            v=$(docker exec "$c" printenv AMG_SSO_INTROSPECT 2>/dev/null)
            echo "$c: ${v:-no-definido}"
          done
          echo; echo "===== env del contenedor pagos via inspect (conteo y muestra) ====="
          docker inspect saasmini-pagos -f {{json .Config.Env}} | grep -c INTROSPECT
          docker inspect saasmini-pagos --format "{{range .Config.Env}}{{println .}}{{end}}" | grep -n INTROSPECT || echo "sin INTROSPECT en pagos"
          '