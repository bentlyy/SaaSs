services:
  db:
    image: postgres:15-alpine
    container_name: clinic-db
    restart: unless-stopped
    # El driver json-file de Docker no rota solo. Este healthcheck corria
    # pg_isready cada 5s y, con log_connections + log_disconnections, cada
    # chequeo escribia 3 lineas: 331 MB de log en 3 semanas. Ahora cada
    # archivo tope 10 MB y se conservan 3, ciclo automatico.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "0.0.0.0:5432:5432"
    environment:
      POSTGRES_USER: clinic_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: clinicdb
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./certs:/etc/postgresql/certs:ro
    command: >
      postgres
        -c ssl=on
        -c ssl_cert_file=/etc/postgresql/certs/server.crt
        -c ssl_key_file=/etc/postgresql/certs/server.key
        -c ssl_ca_file=/etc/postgresql/certs/ca.crt
        -c log_connections=on
        -c log_disconnections=on
        -c log_statement=ddl
        -c log_min_duration_statement=1000
        -c shared_preload_libraries=pg_stat_statements
        -c password_encryption=scram-sha-256
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinic_admin -d clinicdb"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  db_data:
