#_TYPE  DATABASE  USER      ADDRESS         METHOD

# Local: healthcheck y tunel SSH. No sale del host, no necesita contrasena.
local    all       all                      trust
host     all       all       127.0.0.1/32    trust
host     all       all       ::1/128         trust

# Bloque de salida que Render asigno al web service de clinic.
# .30 y .71 son las IPs que aparecen en los logs de postgres.
hostssl  all       all       74.220.48.0/24  scram-sha-256

# Todo lo demas se rechaza aqui mismo, dentro de postgres, que es el unico
# punto que ni Docker ni firewalld pueden esquivar.
hostssl  all       all       0.0.0.0/0       reject
hostssl  all       all       ::/0            reject
