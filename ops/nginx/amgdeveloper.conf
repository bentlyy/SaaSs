# AMG corporate site · amgdeveloper.cl + www -> contenedor saasmini-landing (127.0.0.1:3108)
# Staged: no instalar hasta tener el certificado en /etc/nginx/ssl/amgdeveloper.pem y .key

server {
    listen 80;
    server_name amgdeveloper.cl www.amgdeveloper.cl;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name amgdeveloper.cl www.amgdeveloper.cl;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        proxy_pass http://127.0.0.1:3108;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
    }

    ssl_certificate /etc/nginx/ssl/amgdeveloper.pem;
    ssl_certificate_key /etc/nginx/ssl/amgdeveloper.key;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
