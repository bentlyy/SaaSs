# AMG Landing · desarrollo.amgdeveloper.cl -> contenedor saasmini-landing (127.0.0.1:3108)
server {
    server_name desarrollo.amgdeveloper.cl;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        proxy_pass http://127.0.0.1:3108;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/desarrollo.amgdeveloper.cl/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/desarrollo.amgdeveloper.cl/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = desarrollo.amgdeveloper.cl) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name desarrollo.amgdeveloper.cl;

    listen 80;
    return 404; # managed by Certbot


}