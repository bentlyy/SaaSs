# MIGRACIONES LEGACY -> PRODUCTOS NUEVOS
# =======================================
# Este compose NO se levanta: se usa con
#   docker compose -p saas-mini -f ops/migrate.compose.yml run --rm <servicio>
# un producto a la vez, desde `ops/deploy.sh`.
#
# POR QUE EXISTE: los datos legacy viven en volumenes de Docker
# (`saas-mini_saasmini_data_<nombre>`), NO en el repositorio. El contenedor del
# producto nuevo monta otro volumen, asi que no los ve: correr
# `npm run migrate:legacy` en el host no encuentra nada, y correrlo dentro del
# servicio nuevo tampoco. Estos servicios de un uso montan a la vez el volumen
# DESTINO, el del CORE (para resolver la organizacion) y los legacy en SOLO
# LECTURA.
#
# LAS MIGRACIONES CORREN DE UNA EN UNA, NUNCA EN PARALELO. Todas escriben en la
# misma `core.sqlite` para resolver la organizacion, y SQLite bloquea el archivo
# entero: dos a la vez no se "arreglan", una espera el lock y puede agotar el
# tiempo de espera a mitad de una transaccion.
#
# Los volumenes legacy se montan con `:ro` a proposito. Si un migrador abriera la
# base vieja en escritura por un descuido, el dano es permanente y silencioso: la
# fuente es lo unico que no se puede volver a generar.
#
# ── `--org` y la organizacion unica ──────────────────────────────────────────
# Los SIETE volumenes legacy son SIETE empresas demo distintas (Estetica Glow,
# Sport Center MX, Talleres El Mecanico, DocuPro Studio, Clientes Vip Studio,
# Estudio Color & Forma, Bodega Central). Sin `--org`, cada producto resolveria su
# tenant por su slug y crearia SU PROPIA organizacion: nueve organizaciones con
# datos que en realidad son del mismo ejercicio de demostracion, y ningun usuario
# veria una empresa coherente.
#
# Con `--org id_tenant=<slug>` los siete caen en UNA organizacion, que es la que
# `ops/deploy.sh` crea antes de migrar. Los ids son los del SERVIDOR: las copias
# locales de estas bases tienen OTROS ids (mismo esquema, mismos conteos), y usar
# esos crearia organizaciones fantasma que nunca se llenan.
#
# Cambiar esto es una decision de negocio, no tecnica. Para volver al
# comportamiento por defecto (una organizacion por tenant) basta con quitar los
# `--org` de abajo.

name: saas-mini

x-migra: &migra
  image: saas-mini:latest
  working_dir: /app
  restart: "no"
  environment: &migra-env
    NODE_ENV: production
    # El Core se abre en solo lectura para LEER, pero resolver la organizacion
    # ESCRIBE (crea la org). Por eso el volumen va en rw, y por eso de uno en uno.
    CORE_DB_PATH: /app/data/core/core.sqlite
    CORE_URL: https://desarrollo.amgdeveloper.cl
    # La organizacion destino. La pone deploy.sh; aqui solo se documentan los ids.
    AMG_ORG_SLUG: ${AMG_ORG_SLUG:?define AMG_ORG_SLUG (lo hace ops/deploy.sh)}
    # La config del Core exige estos dos al IMPORTAR el modulo en produccion
    # (fail-fast en `config.ts`, no solo en los endpoints de sesion), y los
    # migradores la importan. El CLI no firma sesiones, pero el import no lo
    # sabe: sin ellos, la migracion muere con "Falta la variable ...". Los lee
    # deploy.sh del .env y los exporta al shell en el paso 8.
    AMG_SESSION_SECRET: ${AMG_SESSION_SECRET:?lo pone ops/deploy.sh}
    AMG_SSO_ROOT_SECRET: ${AMG_SSO_ROOT_SECRET:?lo pone ops/deploy.sh}

volumes:
  # ── Destino: los que aun NO existen, declarados aqui para que se creen ──────
  # Declarados "de este proyecto" a proposito. Si se pusieran `external: true`,
  # compose fallaria en el primer deploy porque el volumen no esta todavia, que
  # es justo cuando mas hace falta crearlo.
  saasmini_data_espacios:
  saasmini_data_solicitudes:
  saasmini_data_citas:
  saasmini_data_clientes:
  saasmini_data_core:

  # ── Destino Y fuente a la vez: ya existe, no se toca ────────────────────────
  # Los dos siguientes son el caso raro: su volumen es a la vez la BASE LEGACY que
  # se lee y el DESTINO donde se escribe. El archivo viejo esta en la raiz
  # (`app.db`) y el nuevo en `inventario.sqlite` / `cotizaciones.sqlite`, asi que
  # conviven sin pisarse y no hace falta montar el volumen dos veces.
  #
  # Van como `external: true` por la misma razon que las fuentes legacy, y es
  # especialmente importante aqui: son los unicos volumenes que este compose
  # "crea" Y de los que lee datos. Si fueran administrados, un `down -v` de este
  # archivo se llevaria por delante la fuente y el destino a la vez.
  #
  # En `docker-compose.yml` estos dos SI son administrados: a partir de ya, son
  # volumenes de producto del stack nuevo, y ese compose es su dueno. La
  # pertenencia cambia con el deploy, no por capricho: antes de migrar el due_no
  # es nadie (es un almacen de datos viejo) y despues lo es el stack.
  saasmini_data_inventario:
    external: true
    name: saas-mini_saasmini_data_inventario
  saasmini_data_cotizaciones:
    external: true
    name: saas-mini_saasmini_data_cotizaciones

  # ── Fuentes legacy: `external: true` y por dos razones ──────────────────────
  # 1. Ya existen, con datos reales, y este archivo no tiene nada que ver con
  #    crearlos.
  # 2. `external: true` es lo que impide que un `docker compose -f
  #    ops/migrate.compose.yml down -v` de alguien los borre. El flag de
  #    creacion automatica es el mismo que el de destruccion automatica: sin
  #    `external`, este compose tambien seria dueño de los volumenes legacy.
  #
  # ── EL `name:` DE CADA UNO ES OBLIGATORIO, NO ES COSMETICO ────────────────
  # `external: true` significa "usa este volumen LITERALMENTE, sin tocarlo". El
  # `name: saas-mini` de arriba NO le pone prefijo a los externos: compose solo
  # lo usa para los volumenes que el mismo compose administra. Sin `name:`, este
  # compose buscaria un volumen llamado `saasmini_data_deportes`, que no existe,
  # y las ocho migraciones fallarian con "volume not found" en el servidor, en
  # el primer `run`.
  #
  # Y el fallo no es "no se migro nada y sigue igual": para cuando aparece, ya se
  # desplego la imagen nueva, ya se paro la vieja y ya se borro la mitad del
  # camino. Por eso el nombre va escrito aqui, letra por letra.
  saasmini_data_peluqueria:
    external: true
    name: saas-mini_saasmini_data_peluqueria
  saasmini_data_deportes:
    external: true
    name: saas-mini_saasmini_data_deportes
  saasmini_data_talleres:
    external: true
    name: saas-mini_saasmini_data_talleres
  saasmini_data_documentos:
    external: true
    name: saas-mini_saasmini_data_documentos
  saasmini_data_crm:
    external: true
    name: saas-mini_saasmini_data_crm
  saasmini_data_recordatorios:
    external: true
    name: saas-mini_saasmini_data_recordatorios

services:
  # ── espacios: absorbs deportes ─────────────────────────────────────────────
  migrar-espacios:
    <<: *migra
    volumes:
      - saasmini_data_espacios:/app/data
      - saasmini_data_core:/app/data/core
      - saasmini_data_deportes:/legacy/deportes:ro
    command: >
      npm run migrate:legacy -w @amg/espacios --
      --legacy /legacy/deportes/app.db --origen deportes
      --destino /app/data/espacios.sqlite
      --org id_3d971e6b5a3144d98847=${AMG_ORG_SLUG}

  # ── solicitudes: absorbs talleres ──────────────────────────────────────────
  # Los datos de vehiculo NO tienen destino (solicitudes es de cualquier rubro):
  # el migrador los reporta y quedan solo en el volumen legacy.
  migrar-solicitudes:
    <<: *migra
    volumes:
      - saasmini_data_solicitudes:/app/data
      - saasmini_data_core:/app/data/core
      - saasmini_data_talleres:/legacy/talleres:ro
    command: >
      npm run migrate:legacy -w @amg/solicitudes --
      --legacy /legacy/talleres/app.db --origen talleres
      --destino /app/data/solicitudes.sqlite
      --org id_91612b34959442abbffb=${AMG_ORG_SLUG}

  # ── inventario: su propia base + deportes + talleres ────────────────────────
  # El volumen destino es el MISMO que el del legacy, y eso es correcto: el
  # archivo viejo esta en la raiz (`app.db`) y el nuevo tambien (`inventario.sqlite`).
  # El legacy se abre en solo lectura y los dos conviven sin pisarse. Por eso NO
  # hace falta montar el volumen dos veces: la fuente y el destino son el mismo
  # lugar, con nombres de archivo distintos.
  migrar-inventario:
    <<: *migra
    volumes:
      - saasmini_data_inventario:/app/data
      - saasmini_data_core:/app/data/core
      - saasmini_data_deportes:/legacy/deportes:ro
      - saasmini_data_talleres:/legacy/talleres:ro
    command: >
      npm run migrate:legacy -w @amg/inventario --
      --legacy /app/data/app.db
      --deportes /legacy/deportes/app.db
      --talleres /legacy/talleres/app.db
      --destino /app/data/inventario.sqlite
      --org id_bddb16dd29454e81a1ef=${AMG_ORG_SLUG},id_3d971e6b5a3144d98847=${AMG_ORG_SLUG},id_91612b34959442abbffb=${AMG_ORG_SLUG}

  # ── citas: absorbe peluqueria, crm y recordatorios ─────────────────────────
  # El CLI acepta UNA fuente por corrida, asi que se corre tres veces contra el
  # mismo destino. Es idempotente: la segunda y la tercera solo agregan lo que
  # falta y omiten lo que ya esta.
  migrar-citas-peluqueria:
    <<: *migra
    volumes:
      - saasmini_data_citas:/app/data
      - saasmini_data_core:/app/data/core
      - saasmini_data_peluqueria:/legacy/peluqueria:ro
    command: >
      npm run migrate:legacy -w @amg/citas --
      --legacy /legacy/peluqueria/app.db --origen peluqueria
      --destino /app/data/citas.sqlite
      --org id_b6ec419d1e614599ac3d=${AMG_ORG_SLUG}

  migrar-citas-crm:
    <<: *migra
    volumes:
      - saasmini_data_citas:/app/data
      - saasmini_data_core:/app/data/core
      - saasmini_data_crm:/legacy/crm:ro
    command: >
      npm run migrate:legacy -w @amg/citas --
      --legacy /legacy/crm/app.db --origen crm
      --destino /app/data/citas.sqlite
      --org id_997c3b1cb43d47bda1f6=${AMG_ORG_SLUG}

  migrar-citas-recordatorios:
    <<: *migra
    volumes:
      - saasmini_data_citas:/app/data
      - saasmini_data_core:/app/data/core
      - saasmini_data_recordatorios:/legacy/recordatorios:ro
    command: >
      npm run migrate:legacy -w @amg/citas --
      --legacy /legacy/recordatorios/app.db --origen recordatorios
      --destino /app/data/citas.sqlite
      --org id_28be343203a046c4925a=${AMG_ORG_SLUG}

  # ── clientes: absorbe crm (SOLO clientes y seguimientos) ───────────────────
  # Las 10 citas del crm NO se migran aqui: ya las leyo `citas` de la misma base.
  # El migrador lo dice en su informe en vez de duplicarlas.
  migrar-clientes:
    <<: *migra
    volumes:
      - saasmini_data_clientes:/app/data
      - saasmini_data_core:/app/data/core
      - saasmini_data_crm:/legacy/crm:ro
    command: >
      npm run migrate:legacy -w @amg/clientes --
      --legacy /legacy/crm/app.db --origen crm
      --destino /app/data/clientes.sqlite
      --org id_997c3b1cb43d47bda1f6=${AMG_ORG_SLUG}

  # ── cotizaciones: absorbe cotizaciones Y documentos ────────────────────────
  # Los dos tenian una tabla `documents` con el mismo formato. Ojo con el dinero:
  # el `subtotal` del legacy esta en CENTAVOS y el `price` de cada linea en
  # UNIDADES (una linea de 4 x 800 con subtotal 440000), asi que el migrador
  # deduce el factor con `detectarFactor` y REPORTA lo que no puede verificar en
  # vez de multiplicar a ciegas. Los folios chocan entre las dos bases: se
  # renumeran y el original queda en las notas.
  migrar-cotizaciones:
    <<: *migra
    volumes:
      - saasmini_data_cotizaciones:/app/data
      - saasmini_data_core:/app/data/core
      - saasmini_data_documentos:/legacy/documentos:ro
    command: >
      npm run migrate:legacy -w @amg/cotizaciones --
      --legacy /app/data/app.db
      --documentos /legacy/documentos/app.db
      --destino /app/data/cotizaciones.sqlite
      --org id_94c1e402c9ab4fadb30c=${AMG_ORG_SLUG}
