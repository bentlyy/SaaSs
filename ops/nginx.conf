# Gateway de los NUEVE productos de saas-mini  ->  127.0.0.1:31xx
#
# Instalar en el servidor con:
#   sudo cp ops/nginx.conf /etc/nginx/conf.d/saas-mini.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# `desarrollo.amgdeveloper.cl` NO esta aqui: vive en `desarrollo.conf`, con su
# propio certificado y apuntando a 3108. Ese archivo ya es correcto y este no lo
# toca.
#
# ── POR QUE UN `map` Y NO UN BLOQUE `server` POR DOMINIO ────────────────────
# La forma habitual es nueve bloques `server` casi iguales, uno por dominio, cada
# uno con su `proxy_pass`. Es la forma en que se escribio el archivo anterior, y
# ya costo dos veces: apuntaba el dominio de canchas a un producto que no era, y
# el de presupuestos abria otro. Son fallos que no dan error de nginx, no cortan
# el servicio y no aparecen en ningun log: el dominio responde 200 con el producto
# equivocado, y eso se descubre cuando un cliente ve los datos de otro.
#
# Con un solo bloque y un `map`, el par dominio -> puerto esta en UNA tabla, en
# un solo lugar, ordenado y legible de un vistazo. Anadir o corregir un dominio es
# cambiar una linea, y comparar esa tabla con la de `docker-compose.yml` es
# trivial. Un `proxy_pass` equivocado aqui sigue siendo posible, pero se ve.
#
# El `map` y el bloque se_declaran en este archivo (que nginx incluye dentro de
# `http`), y no dentro de `server`: por eso van arriba del todo.

limit_req_zone $binary_remote_addr zone=saasmini:10m rate=30r/s;

# ── LA TABLA: dominio -> contenedor ─────────────────────────────────────────
# Ojo al puerto. Cada linea de esta tabla tiene que coincidir con el `ports:` del
# servicio correspondiente en `docker-compose.yml`. Si cambia uno, se cambia el
# otro en el mismo deploy: no hay ninguna otra fuente de verdad.
map $host $saasmini_upstream {
    default                     http://127.0.0.1:3108;  # desarrollo (ver desarrollo.conf)

    citas.amgdeveloper.cl      http://127.0.0.1:3100;  # citas
    espacios.amgdeveloper.cl     http://127.0.0.1:3101;  # espacios
    solicitudes.amgdeveloper.cl     http://127.0.0.1:3102;  # solicitudes
    inventario.amgdeveloper.cl       http://127.0.0.1:3103;  # inventario
    cotizaciones.amgdeveloper.cl http://127.0.0.1:3104; # cotizaciones
    crm.amgdeveloper.cl             http://127.0.0.1:3105;  # crm
    activos.amgdeveloper.cl     http://127.0.0.1:3106;  # activos
    checklists.amgdeveloper.cl  http://127.0.0.1:3107;  # checklists

    # Los tres nuevos. Requieren registro DNS antes de poder emitir el
    # certificado, ver "orden de instalacion" mas abajo.
    pagos.amgdeveloper.cl       http://127.0.0.1:3109;  # pagos
}

server {
    # Los nueve productos. `desarrollo` entra aqui solo como red de seguridad del
    # `default` del map; su bloque de verdad esta en desarrollo.conf.
    server_name
        citas.amgdeveloper.cl
        espacios.amgdeveloper.cl
        solicitudes.amgdeveloper.cl
        inventario.amgdeveloper.cl
        cotizaciones.amgdeveloper.cl
        crm.amgdeveloper.cl
        activos.amgdeveloper.cl
        checklists.amgdeveloper.cl
        pagos.amgdeveloper.cl;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Un host que no este en la tabla del map cae en `default` (el Core). Se
    # responde con un error explicito en vez de redirigir: si alguien apunta un
    # dominio nuevo a esta IP y esquece anadirlo a la tabla, ver el Core es
    # confuso, pero ver un 404 con este texto dice exactamente que falta.
    server_tokens off;

    location / {
        limit_req zone=saasmini burst=20 nodelay;
        proxy_pass $saasmini_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # El Core manda cookies de sesion y los productos redirects: sin esto,
        # una respuesta intermedia sin Location se cachea y el login da un bucle.
        proxy_buffering off;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate     /etc/letsencrypt/live/saasmini-nuevo/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/saasmini-nuevo/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# ── Los dos dominios RETIRADOS ──────────────────────────────────────────────
# `docs` y `recordatorios` ya no son productos: sus datos se fusionaron en
# cotizaciones y citas respectivamente. Sus puertos (3105, 3106) se reasignaron a
# clientes y activos para que el rango 3100-3109 quede completo; es seguro porque
# estos bloques redirigen por NOMBRE, sin pasar por el map ni por el puerto.
#
# Se REDIRIGEN en vez de desaparecer. Borrar el `server` haria que quien todavia
# teclee la direccion recibiera un error de certificado (el dominio seguiria
# apuntando aqui, pero sin bloque que lo atienda), que es peor que un 301. Y el
# motivo mas importante: si alguien guarda un enlace viejo de un presupuesto o
# de un recordatorio, el 301 lo lleva al lugar donde ahora vive ese dato.
#
# Por esto el certificado tiene que seguir cubriendo `docs` y `recordatorios`
# aunque ya no haya producto detras: un redirect en HTTPS con un nombre fuera
# del certificado muestra un aviso rojo del navegador en vez de redirigir.
#
# Y por esto van en DOS BLOQUES y no en uno con los dos nombres: nginx resuelve
# por `server_name` y gana el PRIMER bloque que coincide, no el que "parece mas
# especifico". Un bloque unico con `docs recordatorios` y un unico `return`
# mandaria los dos a cotizaciones, y `recordatorios` acabaria abriendo
# cotizaciones. Es el mismo tipo de cruce que ya se ha dado dos veces aqui, en el
# sentido contrario: por eso se separa en vez de ahorrar unas lineas.
server {
    server_name docs.amgdeveloper.cl;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    server_tokens off;

    # `docs` era comprobantes; sus documentos hoy son cotizaciones.
    location / {
        return 301 https://cotizaciones.amgdeveloper.cl$request_uri;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate     /etc/letsencrypt/live/saasmini-nuevo/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/saasmini-nuevo/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    server_name recordatorios.amgdeveloper.cl;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    server_tokens off;

    # `recordatorios` ahora son citas que selestionan, no avisos de WhatsApp.
    location / {
        return 301 https://citas.amgdeveloper.cl$request_uri;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate     /etc/letsencrypt/live/saasmini-nuevo/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/saasmini-nuevo/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    server_name clientes.amgdeveloper.cl;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    server_tokens off;

    # El TERCER retirado, y el unico que se dejo de publicar por un motivo de
    # seguridad: Cloudflare responde "Suspected Phishing" en este host, que es un
    # falso positivo de su feed a nivel de hostname. El producto no cambio, cambio
    # el nombre: ahora es `crm` y sigue en el mismo puerto 3105.
    #
    # El 301 se deja puesto aunque hoy sea invisible para el visitante: la pantalla
    # de phishing se responde ANTES de llegar al origen, asi que mientras Cloudflare
    # tenga el host marcado nadie ve este redirect. Sirve para lo que llegue
    # directo al origen y para cuando Cloudflare levante la marca.
    location / {
        return 301 https://crm.amgdeveloper.cl$request_uri;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate     /etc/letsencrypt/live/saasmini-nuevo/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/saasmini-nuevo/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# ── HTTP -> HTTPS ───────────────────────────────────────────────────────────
# Solo para los nombres de este archivo. Un `server` en el 80 que fuera a catch-all
# se adjudicaria los dominios de los OTROS archivos (transallendes, desarrollo) y
# los robaria, porque el primer `server` que coincide gana.
server {
    server_name
        citas.amgdeveloper.cl
        espacios.amgdeveloper.cl
        solicitudes.amgdeveloper.cl
        inventario.amgdeveloper.cl
        cotizaciones.amgdeveloper.cl
        crm.amgdeveloper.cl
        activos.amgdeveloper.cl
        checklists.amgdeveloper.cl
        pagos.amgdeveloper.cl
        clientes.amgdeveloper.cl
        docs.amgdeveloper.cl
        recordatorios.amgdeveloper.cl;

    listen 80;
    return 301 https://$host$request_uri;
}

# ── ORDEN DE INSTALACION (importante) ───────────────────────────────────────
# 1. DNS: renombrar los registros viejos a los nombres de producto
#    (agenda->citas, canchas->espacios, ordenes->solicitudes, stock->inventario,
#    presupuestos->cotizaciones) y crear los A de activos, checklists y pagos ->
#    146.181.55.59. Sin esto, el paso 2 falla y no es culpa de certbot.
# 2. Ampliar el certificado para que cubra los once nombres. Se usa `--expand`
#    sobre el nombre `saasmini-nuevo` y NO un `certbot --nginx` suelto: este
#    ultimo crearia un certificado NUEVO con otra ruta, y los dos bloques de
#    arriba dejarian de encontrar el theirs.
#
#      sudo certbot certonly --cert-name saasmini-nuevo --expand \
#        -d citas.amgdeveloper.cl -d espacios.amgdeveloper.cl \
#        -d solicitudes.amgdeveloper.cl -d inventario.amgdeveloper.cl \
#        -d cotizaciones.amgdeveloper.cl -d crm.amgdeveloper.cl \
#        -d docs.amgdeveloper.cl -d recordatorios.amgdeveloper.cl \
#        -d clientes.amgdeveloper.cl \
#        -d activos.amgdeveloper.cl -d checklists.amgdeveloper.cl \
#        -d pagos.amgdeveloper.cl
#
#    `docs`, `recordatorios` y `clientes` se siguen pidiendo a proposito: sin ellos
#    en el SAN, sus redirects de arriba darian error de certificado.
# 3. Copiar este archivo y recargar nginx.
# 4. `docker compose up -d` (los contenedores ya tienen que estar escuchando en
#    esos puertos: nginx da 502 mientras tanto, que es un sintoma claro).
